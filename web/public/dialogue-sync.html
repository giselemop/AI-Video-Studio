<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>口型与双人回应 · 本地小样对比</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151c;color:#edf3fa}body{max-width:1500px;margin:auto;padding:26px}h1{font-size:27px;margin:0 0 12px}p{color:#b6c2d1;line-height:1.8}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}button,select{font:inherit;color:inherit;background:#233247;border:1px solid #4a607b;border-radius:8px;padding:10px 13px;cursor:pointer}.primary{background:#286bc0}button:disabled{opacity:.4;cursor:wait}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{min-width:0;background:#192332;border:1px solid #35485f;border-radius:12px;overflow:hidden}article h2{font-size:18px;margin:14px}article p{font-size:13px;margin:0 14px 12px}.frame{aspect-ratio:16/9;overflow:hidden;background:#04080c}video{display:block;width:100%;height:100%;object-fit:contain;transform:scale(var(--zoom,1));transform-origin:var(--origin,50% 45%)}input[type=range]{flex:1;min-width:180px;accent-color:#a6ceff}output{font-variant-numeric:tabular-nums}.badge{font-size:13px;background:#234338;color:#c2ead5;padding:6px 11px;border-radius:18px}#status{color:#c6dfff;min-height:24px}.note{background:#182331;border-left:3px solid #6584b3;padding:12px 16px}.compare{display:block;max-width:100%;margin:18px auto;border-radius:10px}a{color:#acd0ff}[hidden]{display:none!important}@media(max-width:600px){body{padding:16px}.players{grid-template-columns:1fr}}
</style>
<h1>口型与双人回应 · 本地小样对比</h1><p id="intro">正在读取本地小样…</p>
<main id="ready" hidden><span class="badge">纯本地 · 相同原声片段 · 十秒版保留</span>
<div class="toolbar"><label for="clip">片段</label><select id="clip"></select><span id="excerpt"></span></div>
<div class="toolbar"><button id="play" class="primary">两版同步播放</button><button id="pause">暂停</button><button id="restart">从头播放</button><button id="previous">前一帧</button><button id="next">后一帧</button></div>
<div class="toolbar"><label for="speed">速度</label><select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select><label for="sound">声音</label><select id="sound"><option value="1">新版原声</option><option value="0">上一版原声</option><option value="mute">静音</option></select><label for="zoom">画面</label><select id="zoom"><option value="full">完整画面</option><option value="primary">女方面部</option><option value="male">男方面部</option><option value="mouth">说话者嘴部</option></select></div>
<div class="players"><article><h2>上一版 · 相同时段</h2><div class="frame"><video id="before" preload="auto" playsinline muted></video></div><p>来自此前十秒版，保留该时段原声</p><p><a id="beforeLink">打开基线片段</a></p></article><article><h2>本轮小样 · 相同时段</h2><div class="frame"><video id="after" preload="auto" playsinline></video></div><p>重新生成音频驱动，核对口型与表情过渡</p><p><a id="afterLink">打开新版小样</a> · <a id="driverLink">查看原生音频嘴部驱动</a></p></article></div>
<div class="toolbar"><input id="seek" aria-label="共同播放帧" type="range" min="0" max="47" step="1" value="0"><output id="clock"></output></div>
<p id="status" role="status"></p><p id="playbackEvidence"></p><p id="audioEvidence"></p><div id="moments" class="toolbar"></div>
<p class="note">两段小样保留同一段对白和声音，技术验收通过；每个字的口型及表情自然度仍以观看为准。双人小样保留原来的头部与视线表演，用新音频驱动嘴部，面部动画区域之外为片段首帧静态参考。2K为后期输出。现有十秒版继续保留。</p>
<img id="comparison" class="compare" alt="相同时刻分别对齐的人物前后定格"><p>定格分别对齐两版人物，可结合正常、半速和嘴部局部查看。</p>
<p><a href="/dialogue-visual.html">查看保留的十秒对话版</a></p></main>
<script>
const $=s=>document.querySelector(s),players=[$('#before'),$('#after')];let data,current=0,playing=false,loaded=false,lastSync=0;
function asset(path){if(typeof path!=='string'||!(path.startsWith('Artifacts/')||path.startsWith('DialogueSync20261025/'))||path.includes('..')||path.includes('\\'))throw Error('本地媒体路径无效');return '/api/media?assetPath='+encodeURIComponent(path)}
function clip(){return data.clips[current]}
function audioEvidence(){$('#audioEvidence').textContent=players.map((v,i)=>(i?'新版':'上一版')+'：'+(v.muted?'静音':'声音开启，音量 '+Math.round(v.volume*100)+'%')).join('；')}
function sound(){players.forEach((v,i)=>{v.muted=$('#sound').value!==String(i);v.volume=1});audioEvidence()}
function evidence(){$('#playbackEvidence').textContent=players.map((v,i)=>(i?'新版':'上一版')+'：'+v.currentTime.toFixed(3)+'秒 / '+(Number.isFinite(v.duration)?v.duration.toFixed(3):'读取中')+'秒，'+(v.ended?'已完整播放':v.paused?'暂停':'播放中')).join('；')}
function ready(){loaded=players.every(v=>v.readyState>=2);$('#play').disabled=!loaded;$('#restart').disabled=!loaded;if(!playing)$('#status').textContent=loaded?'两版已就绪 · 仅播放所选一路原声':'正在读取视频…'}
function zoom(){if(!data)return;const mode=$('#zoom').value;players.forEach((v,i)=>{const origin=clip().origins[i],point=mode==='male'?origin.male:mode==='mouth'?origin.mouth:origin.primary,z=mode==='full'?1:mode==='mouth'?3:2;v.style.setProperty('--zoom',String(z));v.style.setProperty('--origin',(z*point[0]-.5)/(z-1||1)*100+'% '+(z*point[1]-.5)/(z-1||1)*100+'%')})}
function clock(){if(!data)return;const t=players[0].currentTime,n=Math.min(clip().frames-1,Math.round(t*24));$('#clock').textContent=t.toFixed(3)+' / '+clip().seconds.toFixed(3)+' 秒 · '+n+' 帧';$('#seek').value=n;evidence();zoom()}
function pause(){playing=false;players.forEach(v=>v.pause());evidence()}
function seek(n){pause();n=Math.max(0,Math.min(clip().frames-1,n));players.forEach(v=>v.currentTime=n/24);clock()}
async function play(restart=false){if(!loaded)return;if(restart||players[0].ended)players.forEach(v=>v.currentTime=0);else players[1].currentTime=players[0].currentTime;sound();try{await Promise.all(players.map(v=>v.play()));playing=true;$('#status').textContent='两版同步播放中'}catch(e){pause();$('#status').textContent='请再次点击播放'}}
function choose(){pause();current=Number($('#clip').value);loaded=false;$('#excerpt').textContent='原片 '+clip().startSeconds.toFixed(3)+'–'+(clip().startSeconds+clip().seconds).toFixed(3)+' 秒';$('#seek').max=clip().frames-1;players.forEach((v,i)=>{v.src=asset(clip().paths[i]);v.playbackRate=Number($('#speed').value)});$('#beforeLink').href=asset(clip().paths[0]);$('#afterLink').href=asset(clip().paths[1]);$('#driverLink').href=asset(clip().driver);$('#moments').replaceChildren();clip().moments.forEach(m=>{const b=document.createElement('button');b.textContent=m.label;b.onclick=()=>{seek(m.frame);$('#comparison').src=asset(m.compare)};$('#moments').append(b)});$('#comparison').src=asset(clip().moments[0].compare);sound();ready();clock()}
$('#play').onclick=()=>play();$('#restart').onclick=()=>play(true);$('#pause').onclick=pause;$('#previous').onclick=()=>seek(Math.round(players[0].currentTime*24)-1);$('#next').onclick=()=>seek(Math.round(players[0].currentTime*24)+1);$('#seek').oninput=e=>seek(Number(e.target.value));$('#speed').onchange=()=>players.forEach(v=>v.playbackRate=Number($('#speed').value));$('#sound').onchange=sound;$('#zoom').onchange=zoom;$('#clip').onchange=choose;
players.forEach(v=>{['loadeddata','canplay'].forEach(name=>v.addEventListener(name,ready));v.addEventListener('error',()=>{$('#status').textContent='视频读取失败，请打开单独小样检查'});v.addEventListener('ended',()=>{evidence();if(players.every(p=>p.ended)){playing=false;$('#status').textContent='两版均已完整播放当前片段'}})});
function tick(){if(data){if(playing&&!players[0].ended&&!players[1].ended&&performance.now()-lastSync>100){const lead=$('#sound').value==='1'?1:0,follow=1-lead;if(Math.abs(players[follow].currentTime-players[lead].currentTime)>.04)players[follow].currentTime=players[lead].currentTime;lastSync=performance.now()}clock()}requestAnimationFrame(tick)}tick();
fetch('/dialogue-sync.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('本地小样仍在验收');return r.json()}).then(d=>{if(d.technicalStatus!=='Passed')throw Error('本地小样仍在验收');data=d;$('#intro').textContent=d.intro;d.clips.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.label;$('#clip').append(o)});$('#ready').hidden=false;choose()}).catch(e=>$('#intro').textContent=e.message);
</script></html>
