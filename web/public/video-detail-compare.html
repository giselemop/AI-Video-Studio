<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园短片 · 细节对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#eef3fa;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1560px;margin:28px auto;padding:0 24px}h1{font-size:28px;margin:0 0 6px}p{color:#b9c8dc;margin:10px 0}nav,.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;padding:8px 16px;border:1px solid #567aa2;border-radius:8px;color:#eff5fd;background:#1c3550;cursor:pointer}button[aria-pressed=true]{background:#2d6a9e;border-color:#97c9ff}button:disabled{opacity:.45;cursor:wait}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{min-width:0;background:#152235;border:1px solid #334761;border-radius:12px;overflow:hidden}h2{font-size:18px;margin:12px 16px}article p{font-size:14px;margin:8px 16px}a{color:#9fcaff}.frame{aspect-ratio:16/9;overflow:hidden;background:#000}video{width:100%;height:100%;object-fit:contain;display:block}.zoom video{transform:scale(2.5);transform-origin:47% 60%}input[type=range]{flex:1;min-width:240px;accent-color:#85bded}#time{font-variant-numeric:tabular-nums;min-width:115px}.note{margin-top:26px;border-top:1px solid #334761;padding-top:14px;font-size:14px}.error{color:#ffbcbc}#status{min-height:26px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:0 14px}}
</style></head><body><main>
<h1>校园短片 · 细节对照</h1>
<p>同一段动作，同一份中文旁白。先看拾起笔记本的细节，再看完整10秒的连续感。</p>
<nav aria-label="对照片段"><button id="sample" aria-pressed="true">2秒动作对照</button><button id="full" aria-pressed="false" disabled>完整10秒</button><button id="zoom" aria-pressed="false">局部放大</button></nav>
<section class="grid" aria-label="同步对照">
<article><h2>A · 原片</h2><div class="frame"><video id="a" aria-label="原片对照" playsinline preload="auto" muted></video></div><p>原来的10秒成片，保留原始画面。</p><p><a id="link-a" target="_blank" rel="noopener">单独播放</a></p></article>
<article><h2>B · 保细节导出</h2><div class="frame"><video id="b" aria-label="保细节导出对照" playsinline preload="auto" muted></video></div><p>从源素材一次导出，减少重复压缩。</p><p><a id="link-b" target="_blank" rel="noopener">单独播放</a></p></article>
<article><h2>C · SeedVR2修复</h2><div class="frame"><video id="c" aria-label="SeedVR2修复对照" playsinline preload="auto"></video></div><p>轻量混合修复，观察纹理与动作是否自然。</p><p><a id="link-c" target="_blank" rel="noopener">单独播放</a></p></article>
</section>
<div class="controls"><button id="play" disabled>同步播放</button><button id="reset" disabled>回到开头</button><input id="seek" type="range" min="0" max="48" step="1" value="0" aria-label="对照帧" disabled><output id="time">0.00 / 2.04秒</output></div>
<div class="controls"><label>播放速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速观察</option></select></label><label>试听声音 <select id="audio"><option value="c">C · 修复版</option><option value="b">B · 保细节版</option><option value="a">A · 原片</option></select></label></div>
<p id="status" role="status">正在加载对照视频…</p>
<p class="note">重点观察脸部、手与笔记本的边缘、树叶是否抖动。修复会推测纹理，不能纠正源视频的动作或身份变化。配音保持完整，整片仍为1080p / 24FPS；效果待你审核。</p>
</main><script>
const $=s=>document.querySelector(s), videos=['a','b','c'].map(id=>$('#'+id));
const status=$('#status'),play=$('#play'),seek=$('#seek'),reset=$('#reset');
let manifest,mode='sample',offsets=[6,6,0],length=49/24,playing=false,ready=false,generation=0;
function valid(path){if(typeof path!=='string'||!/^Artifacts\/[^?#]+\.mp4$/i.test(path)||path.split('/').includes('..')||/[\\:%]/.test(path))throw Error('视频路径无效');return '/api/media?assetPath='+encodeURIComponent(path)}
function pause(){playing=false;videos.forEach(v=>v.pause());play.textContent='同步播放'}
function label(t){$('#time').textContent=`${Math.max(0,t).toFixed(2)} / ${length.toFixed(2)}秒`}
function position(t){videos.forEach((v,i)=>{v.currentTime=offsets[i]+t});seek.value=Math.min(Math.round(t*24),Number(seek.max));label(t)}
function audio(){videos.forEach(v=>{v.muted=v.id!==$('#audio').value;v.volume=1;v.playbackRate=Number($('#speed').value)})}
async function configure(next){
 pause();ready=false;play.disabled=reset.disabled=seek.disabled=true;mode=next;const token=++generation;
 offsets=mode==='full'?[0,0,0]:[6,6,0];length=mode==='full'?10:49/24;seek.max=mode==='full'?239:48;
 $('#sample').setAttribute('aria-pressed',String(mode==='sample'));$('#full').setAttribute('aria-pressed',String(mode==='full'));
 const paths=[manifest.original,manifest.onePass,mode==='full'?manifest.restoredFull:manifest.restoredSample];
 try{
  const urls=paths.map(valid);
  await Promise.all(videos.map((v,i)=>new Promise((resolve,reject)=>{
   v.onloadedmetadata=()=>resolve();v.onerror=()=>reject(Error('视频暂时无法播放，请检查本地服务。'));
   v.src=urls[i];$('#link-'+v.id).href=urls[i];v.load();
  })));
  if(token!==generation)return;
  if(videos.some((v,i)=>Math.abs(v.duration-(i===2&&mode==='sample'?49/24:10))>.08||v.videoWidth!==1920||v.videoHeight!==1080))throw Error('对照视频规格不一致');
  position(0);audio();ready=true;play.disabled=reset.disabled=seek.disabled=false;
  status.textContent=mode==='full'?'1080p · 24FPS · 完整10秒，三栏同步播放。':'1080p · 24FPS · 原片第6.00–8.04秒，同一动作49帧对照。';
 }catch(error){status.className='error';status.textContent=error.message;videos.forEach(v=>v.removeAttribute('src'))}
}
play.onclick=async()=>{if(!ready)return;if(playing){pause();return}if(videos[2].ended||videos[2].currentTime>=length-.04)position(0);try{audio();await Promise.all(videos.map(v=>v.play()));playing=true;play.textContent='暂停对照'}catch{pause();status.textContent='请再次点击同步播放。'}};
reset.onclick=()=>{pause();position(0)};seek.oninput=()=>{pause();position(Number(seek.value)/24)};
$('#audio').onchange=audio;$('#speed').onchange=audio;$('#sample').onclick=()=>configure('sample');$('#full').onclick=()=>configure('full');
$('#zoom').onclick=()=>{const on=$('#zoom').getAttribute('aria-pressed')!=='true';$('#zoom').setAttribute('aria-pressed',String(on));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('zoom',on))};
videos[2].onended=()=>{pause();label(length);seek.value=seek.max};
function tick(){if(playing){const t=videos[2].currentTime-offsets[2];if(videos[2].ended){pause();label(length);seek.value=seek.max}else{videos.slice(0,2).forEach((v,i)=>{if(!v.seeking&&Math.abs(v.currentTime-offsets[i]-t)>.09)v.currentTime=offsets[i]+t});seek.value=Math.min(Math.round(t*24),Number(seek.max));label(t)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
fetch('/api/video-restore/comparison',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('对照清单尚未就绪');return r.json()}).then(async data=>{manifest=data;[data.original,data.onePass,data.restoredSample,...(data.restoredFull?[data.restoredFull]:[])].forEach(valid);$('#full').disabled=!data.restoredFull;await configure('sample')}).catch(error=>{status.className='error';status.textContent=error.message});
</script></body></html>
