<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面定向修复 · 本地小样</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101319;color:#eaf0f6}body{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px}h2{font-size:20px}p{color:#b3becc;line-height:1.8}.badge{background:#294236;color:#c3e9d2;padding:6px 11px;border-radius:18px;font-size:13px}.tabs,.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:18px 0}button,select,a.button{font:inherit;background:#202c3d;color:inherit;border:1px solid #526379;border-radius:8px;padding:10px 14px;text-decoration:none;cursor:pointer}button[aria-selected=true],.primary{background:#2866ad}button:disabled{opacity:.45;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{min-width:0;border:1px solid #38485c;border-radius:12px;overflow:hidden;background:#171f2b}article h3,article p{margin:13px 15px}article p{font-size:13px}img{display:block;width:100%}.reference{width:270px;max-width:100%;border-radius:10px}.frame{aspect-ratio:16/9;overflow:hidden;background:#030609}video{width:100%;height:100%;display:block;object-fit:contain;transform:scale(var(--zoom,1));transform-origin:50% 43%}input[type=range]{flex:1;min-width:180px}output{font-variant-numeric:tabular-nums}#status{min-height:24px;color:#c6ddfa}.note{padding:12px 16px;border-left:3px solid #6287b6;background:#162131}a{color:#acd0ff}#staticCompare{margin-top:18px}#panel[hidden],#stills[hidden]{display:none}@media(max-width:800px){body{padding:16px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid,.gallery{grid-template-columns:1fr}}
</style>
<h1>画面定向修复 · 本地小样</h1>
<p id="intro">正在读取本地验收结果…</p><span class="badge">纯本地生成 · 旧模型与成片保留 · 画面仍需人工复核</span>
<nav class="tabs" id="tabs" aria-label="对比项目"></nav>
<section id="stills" hidden></section>
<section id="panel" hidden>
<h2 id="groupTitle"></h2><p class="note" id="groupNote"></p>
<div class="toolbar"><button id="play" class="primary">两版同步播放</button><button id="pause">暂停</button><button id="restart">从头播放</button><button id="previous">前一帧</button><button id="next">后一帧</button><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">半速</option></select></label><label>画面 <select id="zoom"><option value="1">完整画面</option><option value="2">中央局部 2 倍</option></select></label></div>
<div class="grid"><article><h3 id="beforeTitle"></h3><div class="frame"><video id="before" preload="auto" playsinline muted></video></div><p id="beforeSpec"></p><p><a id="beforeLink">打开对照原片</a></p></article><article><h3 id="afterTitle"></h3><div class="frame"><video id="after" preload="auto" playsinline muted></video></div><p id="afterSpec"></p><p><a id="afterLink">打开本轮结果</a></p></article></div>
<div class="toolbar"><input id="seek" type="range" min="0" max="47" step="1" value="0" aria-label="共同播放帧"><output id="clock"></output></div>
<p id="status" role="status"></p><p id="playbackEvidence"></p><div id="moments" class="toolbar"></div><img id="staticCompare" alt="选定时点的同帧画面对照" hidden>
</section>
<p>技术通过表示文件、规格和执行记录通过检查。身份、动作自然度和画面偏好需要观看判断；未自动批准发布。</p>
<script>
const $=s=>document.querySelector(s),players=[$('#before'),$('#after')];let data,group,playing=false,loaded=false,lastSync=0,activeKey='';
function asset(path){if(typeof path!=='string'||!(path.startsWith('Artifacts/')||path.startsWith('VisualTargeted20261024/'))||path.includes('..')||path.includes('\\'))throw Error('本地媒体路径无效');return '/api/media?assetPath='+encodeURIComponent(path)}
function ready(){loaded=players.every(v=>v.readyState>=2);$('#play').disabled=!loaded;$('#restart').disabled=!loaded;$('#status').textContent=loaded?'两版已就绪 · 本页静音比较画面':'正在读取视频…'}
function evidence(){if(!group)return;$('#playbackEvidence').textContent=players.map((v,i)=>(i?'本轮':'对照')+'：'+v.currentTime.toFixed(3)+'秒 / '+(Number.isFinite(v.duration)?v.duration.toFixed(3):'读取中')+'秒，'+(v.ended?'已完整播放':v.paused?'暂停':'播放中')).join('；')}
function clock(t){if(!group)return;$('#clock').textContent=t.toFixed(3)+' / '+group.seconds.toFixed(3)+' 秒 · '+Math.min(group.frames-1,Math.round(t*group.fps))+' 帧';$('#seek').value=Math.min(group.frames-1,Math.round(t*group.fps));evidence()}
function pause(){playing=false;players.forEach(v=>v.pause());if(group)evidence()}
function seek(frame){pause();frame=Math.max(0,Math.min(group.frames-1,frame));players.forEach(v=>v.currentTime=frame/group.fps);clock(frame/group.fps)}
async function play(restart=false){if(!loaded)return;if(restart||players[0].ended)players.forEach(v=>v.currentTime=0);else players[1].currentTime=players[0].currentTime;try{await Promise.all(players.map(v=>v.play()));playing=true;$('#status').textContent='两版同步播放中'}catch(error){pause();$('#status').textContent='播放未开始，请重新点击'}}
function tab(key){pause();activeKey=key;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.key===key));$('#stills').hidden=key!=='stills';$('#panel').hidden=key==='stills';if(key==='stills'){group=null;return}group=data.groups.find(g=>g.key===key);if(!group)throw Error('对比片段不存在');$('#groupTitle').textContent=group.title;$('#groupNote').textContent=group.note;$('#seek').max=group.frames-1;$('#beforeTitle').textContent=group.before.title;$('#afterTitle').textContent=group.after.title;['before','after'].forEach((role,i)=>{players[i].src=asset(group[role].path);$( '#'+role+'Spec').textContent=group[role].spec;$('#'+role+'Link').href=asset(group[role].path)});players.forEach(v=>{v.playbackRate=Number($('#speed').value);v.muted=true;v.style.setProperty('--zoom',$('#zoom').value)});$('#moments').replaceChildren();(group.moments||[]).forEach(m=>{const b=document.createElement('button');b.textContent=m.label;b.onclick=()=>{seek(m.frame);if(m.compare){$('#staticCompare').src=asset(m.compare);$('#staticCompare').hidden=false}};$('#moments').append(b)});$('#staticCompare').hidden=true;loaded=false;ready();clock(0)}
$('#play').onclick=()=>play();$('#pause').onclick=pause;$('#restart').onclick=()=>play(true);$('#previous').onclick=()=>seek(Math.round(players[0].currentTime*group.fps)-1);$('#next').onclick=()=>seek(Math.round(players[0].currentTime*group.fps)+1);$('#seek').oninput=e=>seek(Number(e.target.value));$('#speed').onchange=()=>players.forEach(v=>v.playbackRate=Number($('#speed').value));$('#zoom').onchange=()=>players.forEach(v=>v.style.setProperty('--zoom',$('#zoom').value));players.forEach(v=>{['loadeddata','canplay'].forEach(e=>v.addEventListener(e,ready));v.addEventListener('ended',()=>{evidence();if(players.every(p=>p.ended)){playing=false;$('#status').textContent='两版均已完整播放'}});v.addEventListener('error',()=>{$('#status').textContent='视频读取失败，请保留当前结果并检查本地文件'})});
function tick(){if(group){if(playing){const t=performance.now();if(t-lastSync>400){if(!players[1].ended&&Math.abs(players[1].currentTime-players[0].currentTime)>.08)players[1].currentTime=players[0].currentTime;lastSync=t}}clock(players[0].currentTime)}requestAnimationFrame(tick)}tick();
fetch('/visual-targeted.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('验收清单尚未发布');return r.json()}).then(d=>{data=d;$('#intro').textContent=d.intro;d.groups.forEach(g=>{const b=document.createElement('button');b.textContent=g.title;b.dataset.key=g.key;b.onclick=()=>tab(g.key);$('#tabs').append(b)});tab(d.groups[0].key)}).catch(e=>{$('#intro').textContent=e.message});
</script></html>
