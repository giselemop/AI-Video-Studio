<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午后对白 · 三镜头新版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111720;color:#edf1f6;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px}h1{font-size:29px;line-height:1.3;margin:7px 0 12px}p{color:#b5c0ce}video{display:block;width:100%;max-height:72vh;background:#080b10;border-radius:14px}button,a{color:inherit}button{padding:10px 15px;border:1px solid #3d5066;border-radius:9px;background:#21364a;cursor:pointer}button:hover{background:#315471}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.tag{color:#79dcbb}.muted{font-size:14px;color:#9caabc}.lines{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.line{text-align:left;background:#182531}.line span{display:block;font-size:13px;color:#b2c0cf}.compare{border-top:1px solid #2c3b4d;padding-top:20px;margin-top:28px}#previous{margin-top:15px}#status,#previous-status{font-variant-numeric:tabular-nums}audio{max-width:100%;height:40px}.audio-review{margin:20px 0}.audio-review summary{color:#b5c0ce;cursor:pointer}@media(max-width:650px){main{padding:22px 12px}.lines{grid-template-columns:1fr}h1{font-size:23px}}
video[hidden]{display:none}
</style></head>
<body><main>
<div class="tag">纯本地 · 10 秒 · 三镜头</div><h1>一句打趣，一句回应</h1>
<p>米色外套的女方与橄榄绿外套的男方，保留原来的四句对白。观察语气、目光，以及说完话后的反应。</p>
<video id="result" controls playsinline preload="metadata"></video>
<div class="row"><button id="start" disabled>从头完整播放</button><button id="pause" disabled>暂停</button><span id="status" class="muted" aria-live="polite">正在读取样片信息…</span></div>
<div id="shots" class="row" aria-label="三个镜头"></div>
<div id="lines" class="lines" aria-label="四句对白"></div><p id="note" class="muted"></p>
<details class="audio-review"><summary>单独试听新版对白</summary><audio id="dialogue" controls preload="none"></audio></details>
<section class="compare"><button id="load-previous" disabled>加载上一版 9.5 秒对照</button><p class="muted">上一版为固定双人镜头，便于比较对白节奏和人物反应。</p><video id="previous" controls playsinline preload="none" hidden></video><p id="previous-status" class="muted"></p></section>
</main><script>
const result=document.querySelector('#result'),previous=document.querySelector('#previous'),dialogue=document.querySelector('#dialogue'),status=document.querySelector('#status');
let manifest;
function media(path){return '/api/media?assetPath='+encodeURIComponent(path)}
function refresh(){status.textContent=`${result.currentTime.toFixed(2)} / ${Number.isFinite(result.duration)?result.duration.toFixed(2):'—'} 秒 · ${result.videoWidth}×${result.videoHeight} · 音量 ${Math.round(result.volume*100)}%${result.muted?'（静音）':''}${result.ended?' · 播放结束':''}`}
async function playFrom(time){result.currentTime=time;result.muted=false;result.volume=1;try{await result.play()}catch{status.textContent='请点击视频上的播放按钮开始观看。'}}
for(const event of ['loadedmetadata','timeupdate','volumechange','ended','pause','play','seeked'])result.addEventListener(event,refresh);
result.addEventListener('error',()=>{status.textContent='视频读取失败，请刷新页面重试。'});
for(const current of [result,previous,dialogue])current.addEventListener('play',()=>{for(const other of [result,previous,dialogue])if(other!==current)other.pause()});
for(const event of ['loadedmetadata','timeupdate','ended','volumechange'])previous.addEventListener(event,()=>{document.querySelector('#previous-status').textContent=`上一版：${previous.currentTime.toFixed(2)} / ${Number.isFinite(previous.duration)?previous.duration.toFixed(2):'—'} 秒${previous.ended?' · 播放结束':''}`});
document.querySelector('#start').onclick=()=>playFrom(0);
document.querySelector('#pause').onclick=()=>result.pause();
document.querySelector('#load-previous').onclick=()=>{if(!previous.getAttribute('src'))previous.src=media(manifest.previousPath);previous.hidden=false;document.querySelector('#load-previous').textContent='上一版已加载';};
document.querySelector('.audio-review').addEventListener('toggle',event=>{if(event.target.open&&manifest&&!dialogue.getAttribute('src'))dialogue.src=media(manifest.mixPath)});
fetch('/dialogue-three-shot-preview.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('not ready');return response.json()}).then(data=>{
 if(!data.finalPath||data.shots?.length!==3||data.lines?.length!==4)throw Error('incomplete');manifest=data;
 result.src=media(data.finalPath);if(data.posterPath)result.poster=media(data.posterPath);
 document.querySelector('#note').textContent=data.note;
 for(const shot of data.shots){const button=document.createElement('button');button.textContent=`镜头 ${shot.index}：${shot.label}`;button.onclick=()=>playFrom(shot.startSeconds);document.querySelector('#shots').append(button)}
 for(const line of data.lines){const button=document.createElement('button');button.className='line';button.textContent=(line.role==='female'?'女：':'男：')+line.text;const detail=document.createElement('span');detail.textContent=line.emotionLabel||'';button.append(detail);button.onclick=()=>playFrom(line.startSeconds);document.querySelector('#lines').append(button)}
 for(const id of ['start','pause','load-previous'])document.querySelector('#'+id).disabled=false;
}).catch(()=>{status.textContent='三镜头样片仍在制作中，完成后刷新即可观看。'});
</script></body></html>
